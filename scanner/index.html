  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

latin */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"41b100c1-a1da-4f7a-8d38-e1bf9c6fe8d8\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f2f2f3;\n  --color-surface: #e9e9ea;\n  --color-text: #1d1f20;\n  --color-accent: #5980a6;\n  --color-accent-2: #728fab;\n  --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f5f5f8;\n  --color-neutral-200: #e7e7ea;\n  --color-neutral-300: #d4d4d7;\n  --color-neutral-400: #b7b7ba;\n  --color-neutral-500: #98989b;\n  --color-neutral-600: #7a7a7d;\n  --color-neutral-700: #5d5d60;\n  --color-neutral-800: #424244;\n  --color-neutral-900: #2b2b2d;\n\n  --color-accent-100: #eef6ff;\n  --color-accent-200: #d6ebff;\n  --color-accent-300: #b5d9fd;\n  --color-accent-400: #94bce3;\n  --color-accent-500: #749dc4;\n  --color-accent-600: #597ea3;\n  --color-accent-700: #416180;\n  --color-accent-800: #2c455d;\n  --color-accent-900: #1d2d3d;\n\n  --color-accent-2-100: #eef6ff;\n  --color-accent-2-200: #d6ebff;\n  --color-accent-2-300: #bdd8f2;\n  --color-accent-2-400: #9ebbd8;\n  --color-accent-2-500: #7e9cb8;\n  --color-accent-2-600: #627d98;\n  --color-accent-2-700: #486077;\n  --color-accent-2-800: #314457;\n  --color-accent-2-900: #1f2d3a;\n\n  --font-heading: \"Barlow Condensed\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Barlow\", system-ui, sans-serif;\n\n  --space-1: 3.4px;\n  --space-2: 6.8px;\n  --space-3: 10.2px;\n  --space-4: 13.6px;\n  --space-6: 20.4px;\n  --space-8: 27.2px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint {\n  position: relative;\n  border: 1px solid var(--color-divider);\n  border-radius: 0;\n}\n/* The overlay image treatments (halftone, duotone) clip their overlay\n   (overflow:hidden); a blueprint wrapper draws its registration marks\n   outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — blueprint frame: components are wireframe objects (see .blueprint\n     and .corner above) — square, transparent, hairline-bordered — */\n.card, .btn, .input, .tag, .seg, .dialog { border-radius: 0; }\n.card, . }}<\u002Fdiv>\n  <\u002Fsc-if>\n  <div style=\"display: flex; flex-direction: column; gap: var(--space-2); min-width: 0;\">\n    <h2 style=\"margin: 0; font-family: 'Noto Serif Georgian', serif; font-weight: 600; font-size: 20px; line-height: 1.25; text-wrap: pretty;\">{{ book.title }}<\u002Fh2>\n    <sc-if value=\"{{ showMeta }}\" hint-placeholder-val=\"{{ true }}\">\n      <sc-for list=\"{{ metaRows }}\" as=\"m\" hint-placeholder-count=\"2\">\n        <span style=\"font-size: 14px; line-height: 1.35; color: var(--color-neutral-800);\">{{ m.v }}<\u002Fspan>\n      <\u002Fsc-for>\n    <\u002Fsc-if>\n    <div style=\"margin-top: auto; display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap;\">\n      <sc-if value=\"{{ hasBookUrl }}\" hint-placeholder-val=\"{{ false }}\">\n        <a href=\"{{ book.bookUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"font-size: 12px; font-variant-numeric: tabular-nums; text-decoration: none; padding: 12px 0; margin: -12px 0;\">{{ scannedFmt }} ↗<\u002Fa>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ noBookUrl }}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"font-size: 12px; color: var(--color-neutral-600); font-variant-numeric: tabular-nums;\">{{ scannedFmt }}<\u002Fspan>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"grid-column: 1 / -1; display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3);\">\n    <span style=\"font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-neutral-700);\">Suggested donation<\u002Fspan>\n    <span style=\"font-family: var(--font-heading); font-weight: 600; font-size: 30px; line-height: 1.05; font-variant-numeric: tabular-nums; color: oklch(0.52 0.19 27);\">{{ donation }}<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isNotFound }}\" hint-placeholder-val=\"{{ false }}\">\n<section class=\"blueprint\" style=\"display: flex; flex-direction: column; gap: =\"position: absolute; left: var(--space-3); top: var(--space-3); font-size: 13px; color: var(--color-bg); background: rgba(0,0,0,0.45); padding: 4px 8px;\">{{ camHint }}<\u002Fspan>\n  <button class=\"btn btn-icon\" sc-camel-on-click=\"{{ closeCam }}\" aria-label=\"Close scanner\" style=\"position: absolute; right: 0; top: 0; width: 48px; height: 48px; color: var(--color-bg); border-color: transparent; background: rgba(0,0,0,0.45);\">\n    <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 6 6 18\"><\u002Fpath><path d=\"m6 6 12 12\"><\u002Fpath><\u002Fsvg>\n  <\u002Fbutton>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isError }}\" hint-placeholder-val=\"{{ false }}\">\n<section class=\"blueprint\" style=\"display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-6);\">\n  <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n  <h2 style=\"margin: 0; font-family: var(--font-heading); font-weight: 600; font-size: 22px;\">Camera unavailable<\u002Fh2>\n  <p style=\"margin: 0; font-size: 14px; line-height: 1.4; text-wrap: pretty;\">{{ errorBody }}<\u002Fp>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ camClosed }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"flex: 1; display: flex; flex-direction: column; justify-content: flex-end; min-height: 120px;\">\n  <button class=\"btn btn-primary blueprint\" sc-camel-on-click=\"{{ openCam }}\" style=\"min-height: 72px; font-size: 20px; font-family: var(--font-heading); font-weight: 600; letter-spacing: 0.04em; gap: var(--space-2);\">\n    <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n    <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7V5a2 2 0 0 1 2-2h2\"><\u002Fpath><path d=\"M17 3h2a2 2 0 0 1 2 2v2\"><\u002Fpath><path d=\"M21 17v2a2 2 0 0 1-2 2h-2\"><\u002Fpath><path d=\"M7 21H5a2 2 0 0 1-2-2v-2\"><\u002Fpath><path d=\"M8 7v10\"><\u002Fpath><path d=\"M12 7v10\"><\u002Fpath><path d=\"M17 7v10\"><\u002Fpath><\u002Fsvg>\n    {{ openLabel }}\n  <\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<form sc-camel-on-submit=\"{{ submitManual }}\" style=\"display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-3);\">\n  <input class=\"input\" aria-label=\"ISBN\" inputmode=\"numeric\" autocomplete=\"off\" enterkeyhint=\"search\" placeholder=\"Type ISBN\" value=\"{{ manualValue }}\" sc-camel-on-input=\"{{ onManualInput }}\" style=\"min-height: 52px; font-size: 18px; font-variant-numeric: tabular-nums;\">\n  <button class=\"btn btn-secondary\" type=\"submit\" style=\"min-height: 52px; min-width: 88px; font-size: 16px;\">Look up<\u002Fbutton>\n<\u002Fform>\n<sc-if value=\"{{ manualInvalid }}\" hint-placeholder-val=\"{{ false }}\">\n  <span style=\"margin-top: calc(-1 * var(--space-3)); font-size: 13px; color: var(--color-accent-800);\">Not a valid ISBN<\u002Fspan>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showMeta&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behaviour&quot;},&quot;preview&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;live&quot;,&quot;idle&quot;,&quot;found&quot;,&quot;notfound&quot;,&quot;error&quot;],&quot;default&quot;:&quot;live&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Design preview&quot;}}\">\nconst SHEET_URL = 'https://docs.google.com/spreadsheets/d/1OMB1NlV6G5FUexneGaUtKtfWk4O-ZyG7ocOZHyCl5TM/gviz/tq?tqx=out:csv&gid=62061774';\nconst CACHE_KEY = 'gbdIsbnScanner.catalogue.v3';\nconst ZXING_URL = 'https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js';\nconst SAMPLE = { title: 'ჯაყოს ხიზნები', author: 'მიხეილ ჯავახიშვილი', publisher: 'ინტელექტი', coverUrl: '', bookUrl: '', isbn: '9789941000000', donation: '12' };\n\nfunction parseCSV(text) {\n  const rows = []; let row = [], cell = '', q = false;\n  for (let i = 0; i < text.length; i++) {\n    const c = text[i];\n    if (q) { if (c === '\"') { if (text[i + 1] === '\"') { cell += '\"'; i++; } else q = false; } else cell += c; }\n    else if (c === '\"') q = true;\n    else if (c === ',') { row.push(cell); cell = ''; }\n    else if (c === '\\n' || c === '\\r') { if (c === '\\r' && text[i + 1] === '\\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }\n    else cell += c;\n  }\n  if (cell || row.length) { row.push(cell); rows.push(row); }\n  return rows;\n}\nconst norm = s => s.toLowerCase().replace(/[\\s_-]+/g, '');\nconst findCol = (h, ...keys) => h.findIndex(x => keys.some(k => norm(x).includes(norm(k))));\n\nfunction ean13Valid(d) {\n  if (!/^\\d{13}$/.test(d)) return false;\n  let s = 0; for (let i = 0; i < 12; i++) s += +d[i] * (i % 2 ? 3 : 1);\n  return (10 - (s % 10)) % 10 === +d[12];\n}\nfunction isbn10Valid(d) {\n  if (!/^\\d{9}[\\dX]$/.test(d)) return false;\n  let s = 0; for (let i = 0; i < 10; i++) s += (d[i] === 'X' ? 10 : +d[i]) * (10 - i);\n  return s % 11 === 0;\n}\nfunction toIsbn13(raw) {\n  const d = String(raw || '').toUpperCase().replace(/[^0-9X]/g, '');\n  if (d.length === 13) return ean13Valid(d) && /^97[89]/.test(d) ? d : null;\n  if (d.length === 10 && isbn10Valid(d)) {\n    const b = '978' + d.slice(0, 9); let s = 0;\n    for (let i = 0; i < 12; i++) s += +b[i] * (i % 2 ? 3 : 1);\n    return b + ((10 - (s % 10)) % 10);\n  }\n  return null;\n}\nconst fmt13 = d => d && d.length === 13 ? `${d.slice(0, 3)}-${d.slice(3, 12)}-${d[12]}` : (d || '');\nfunction fmtDonation(v) {\n  const s = String(v || '').trim();\n  if (!s) return 'Unknown';\n  const n = parseFloat(s.replace(/[^\\d.,]/g, '').replace(',', '.'));\n  if (isNaN(n)) return s;\n  return '€' + (Number.isInteger(n) ? n : n.toFixed(2));\n}\n\nclass Component extends DCLogic {\n  state = { books: [], loadState: 'loading', result: null, scanned: '', book: null, badCover: false, cam: 'closed', errorKind: '', manualValue: '', manualInvalid: false, flash: false };\n  map = new Map();\n  video = null;\n\n  componentDidMount() {\n    try {\n      const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');\n      if (c && c.books) { this.setBooks(c.books); this.setState({ loadState: 'cached' }); }\n    } catch (e) {}\n    this.fetchSheet();\n  }\n  componentWillUnmount() { this.stopCamera(); }\n\n  async fetchSheet() {\n    try {\n      const res = await fetch(SHEET_URL, { cache: 'no-store' });\n      if (!res.ok) throw new Error(res.status);\n      const rows = parseCSV(await res.text());\n      const h = rows[0].map(x => x.trim());\n      const iT = findCol(h, 'title'), iA = findCol(h, 'author'), iP = findCol(h, 'publisher'),\n        iI = findCol(h, 'image', 'cover'), iU = findCol(h, 'book_url', 'link'), iS = findCol(h, 'isbn'),\n        iD = findCol(h, 'suggested_donation', 'donation');\n      const g = (r, i) => (i >= 0 ? (r[i] || '').trim() : '');\n      const books = rows.slice(1).filter(r => g(r, iT)).map(r => ({\n        id: g(r, 0), title: g(r, iT), author: g(r, iA), publisher: g(r, iP), coverUrl: g(r, iI), bookUrl: g(r, iU), isbn: g(r, iS), donation: g(r, iD)\n      }));\n      this.setBooks(books);\n      this.setState({ loadState: 'live' });\n      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), books })); } catch (e) {}\n    } catch (e) {\n      this.setState(s => ({ loadState: s.books.length ? 'cached' : 'failed' }));\n    }\n  }\n  setBooks(books) {\n    const m = new Map();\n    books.forEach(b => String(b.isbn || '').split(/[;,/\\s]+/).forEach(x => { const k = toIsbn13(x); if (k) m.set(k, b); }));\n    this.map = m;\n    this.setState({ books });\n  }\n\n  lookup(isbn13) {\n    if (navigator.vibrate) navigator.vibrate(50);\n    const book = this.map.get(isbn13) || null;\n    this.setState({ scanned: isbn13, book, badCover: false, result: book ? 'found' : 'notfound', manualValue: '', manualInvalid: false, flash: true });\n    clearTimeout(this.flashT); this.flashT = setTimeout(() => this.setState({ flash: false }), 600);\n    if (book && book.coverUrl) { const im = new Image(); im.onerror = () => { if (this.state.book === book) this.setState({ badCover: true }); }; im.src = book.coverUrl; }\n    window.scrollTo(0, 0);\n  }\n\n  // Camera keeps running after a hit; the same code is ignored for 3s so a book left in frame doesn't re-trigger.\n  accept(raw) {\n    const d = String(raw || '').replace(/\\D/g, '');\n    if (!(d.length === 13 && /^97[89]/.test(d) && ean13Valid(d))) return;\n    const now = Date.now();\n    if (d === this.lastCode && now - this.lastAt < 3000) { this.lastAt = now; return; }\n    this.lastCode = d; this.lastAt = now;\n    this.lookup(d);\n  }\n\n  openCam = async () => {\n    if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {\n      this.setState({ cam: 'error', errorKind: 'unsupported' }); return;\n    }\n    this.setState({ cam: 'open' });\n    this.scanToken = (this.scanToken || 0) + 1;\n    const token = this.scanToken;\n    try {\n      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });\n      if (token !== this.scanToken) { stream.getTracks().forEach(t => t.stop()); return; }\n      this.stream = stream;\n      const v = this.video;\n      v.srcObject = stream;\n      await v.play().catch(() => {});\n      let native = false;\n      if ('BarcodeDetector' in window) {\n        try { native = (await window.BarcodeDetector.getSupportedFormats()).includes('ean_13'); } catch (e) {}\n      }\n      if (native) this.loopNative(token); else await this.runZxing(token);\n    } catch (e) {\n      if (token !== this.scanToken) return;\n      this.stopCamera();\n      this.setState({ cam: 'error', errorKind: e && e.name === 'NotAllowedError' ? 'denied' : 'unsupported' });\n    }\n  };\n  loopNative(token) {\n    const det = new window.BarcodeDetector({ formats: ['ean_13'] });\n    let last = 0;\n    const tick = async (t) => {\n      if (token !== this.scanToken) return;\n      if (t - last > 100 && this.video && this.video.readyState >= 2) {\n        last = t;\n        try { const codes = await det.detect(this.video); codes.forEach(c => this.accept(c.rawValue)); } catch (e) {}\n      }\n      this.raf = requestAnimationFrame(tick);\n    };\n    this.raf = requestAnimationFrame(tick);\n  }\n  async runZxing(token) {\n    if (!window.ZXingBrowser) {\n      await new Promise((ok, fail) => { const s = document.createElement('script'); s.src = ZXING_URL; s.onload = ok; s.onerror = fail; document.head.appendChild(s); });\n    }\n    if (token !== this.scanToken) return;\n    const reader = new window.ZXingBrowser.BrowserMultiFormatReader();\n    this.zx = await reader.decodeFromStream(this.stream, this.video, (res) => {\n      if (res && token === this.scanToken) this.accept(res.getText());\n    });\n  }\n  stopCamera() {\n    this.scanToken = (this.scanToken || 0) + 1;\n    cancelAnimationFrame(this.raf);\n    try { this.zx && this.zx.stop(); } catch (e) {}\n    this.zx = null;\n    if (this.stream) this.stream.getTracks().forEach(t => t.stop());\n    this.stream = null;\n    if (this.video) this.video.srcObject = null;\n  }\n\n  submitManual = (e) => {\n    if (e && e.preventDefault) e.preventDefault();\n    const k = toIsbn13(this.state.manualValue);\n    if (!k) { this.setState({ manualInvalid: true }); return; }\n    if (document.activeElement) document.activeElement.blur();\n    this.lookup(k);\n  };\n\n  renderVals() {\n    const preview = this.props.preview ?? 'live';\n    const s = { ...this.state };\n    if (preview !== 'live') {\n      if (preview === 'found') { s.result = 'found'; s.book = s.book || s.books.find(b => b.coverUrl) || SAMPLE; s.scanned = s.scanned || toIsbn13(s.book.isbn) || '9789941000000'; }\n      if (preview === 'notfound') { s.result = 'notfound'; s.scanned = s.scanned || '9789941000000'; }\n      if (preview === 'error') s.cam = 'error';\n      if (preview === 'idle') s.result = null;\n    }\n    const b = s.book || {};\n    const n = s.books.length, m = this.map.size;\n    const statusText = s.loadState === 'loading' ? 'Loading…' : s.loadState === 'failed' ? 'Catalogue failed' : s.loadState === 'cached' ? `Offline · ${n}` : `${m} / ${n} with ISBN`;\n    const statusColor = s.loadState === 'live' ? 'var(--color-accent)' : s.loadState === 'failed' ? 'var(--color-neutral-900)' : 'var(--color-neutral-400)';\n    const metaRows = [];\n    if (b.author) metaRows.push({ v: b.author });\n    if (b.publisher) metaRows.push({ v: b.publisher });\n    return {\n      statusText, statusColor,\n      isFound: s.result === 'found', isNotFound: s.result === 'notfound',\n      book: b, scannedFmt: fmt13(s.scanned), donation: fmtDonation(b.donation),\n      hasCover: !!b.coverUrl && !s.badCover, noCover: !b.coverUrl || s.badCover,\n      coverCss: b.coverUrl ? `url(\"${String(b.coverUrl).replace(/\"/g, '%22')}\")` : 'none',\n      showMeta: (this.props.showMeta ?? true) && metaRows.length > 0, metaRows,\n      hasBookUrl: !!b.bookUrl, noBookUrl: !b.bookUrl,\n      camOpen: s.cam === 'open', camClosed: s.cam !== 'open', isError: s.cam === 'error',\n      camHint: s.result ? 'Ready for next book' : 'Aim at the barcode',\n      lineColor: s.flash ? 'var(--color-bg)' : 'var(--color-accent-300)',\n      openLabel: s.result ? 'Scan next book' : 'Start scanning',\n      errorBody: s.errorKind === 'denied' ? 'Allow camera access in your browser settings, or type the ISBN below.' : 'This browser can’t scan with the camera (it needs HTTPS). Type the ISBN below.',\n      manualValue: s.manualValue, manualInvalid: s.manualInvalid,\n      onManualInput: (e) => this.setState({ manualValue: e.target.value, manualInvalid: false }),\n      submitManual: this.submitManual,\n      videoRef: (el) => { this.video = el; if (el) { el.setAttribute('playsinline', ''); el.setAttribute('muted', ''); el.muted = true; el.autoplay = true; } },\n      openCam: this.openCam,\n      closeCam: () => { this.stopCamera(); this.setState({ cam: 'closed' }); }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
