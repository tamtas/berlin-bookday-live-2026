<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="_ds/industry-734d1149-613c-4d99-8e8a-3cf4c0013d4d/styles.css">
<script src="_ds/industry-734d1149-613c-4d99-8e8a-3cf4c0013d4d/_ds_bundle.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;800&family=Noto+Serif+Georgian:wght@600&display=swap">
<style>
html, body { margin: 0; height: 100%; background: var(--color-bg); }
body { -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
a { color: var(--color-accent-700); } a:hover { color: var(--color-accent-900); }
</style>
</helmet>
<div style="min-height: 100dvh; display: flex; justify-content: center; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body), 'Noto Sans Georgian', sans-serif;">
<div style="width: 100%; max-width: 480px; min-height: 100dvh; display: flex; flex-direction: column; gap: var(--space-2); padding: 0 var(--space-2) calc(var(--space-2) + env(safe-area-inset-bottom)); box-sizing: border-box;">

<header style="display: flex; align-items: center; gap: var(--space-2); height: 32px; padding-top: env(safe-area-inset-top); font-size: 12px;">
  <span style="font-family: var(--font-heading); font-weight: 600; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase; margin-right: auto;">GBD · ISBN Scanner</span>
  <span style="width: 7px; height: 7px; flex: none; background: {{ statusColor }};"></span>
  <span style="color: var(--color-neutral-700); font-variant-numeric: tabular-nums;">{{ statusText }}</span>
</header>

<sc-if value="{{ isFound }}" hint-placeholder-val="{{ false }}">
<section class="blueprint" style="display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: var(--space-3); padding: var(--space-2);">
  <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
  <sc-if value="{{ hasCover }}" hint-placeholder-val="{{ false }}">
    <div role="img" aria-label="{{ book.title }}" style="width: 96px; aspect-ratio: 2 / 3; background-image: {{ coverCss }}; background-size: cover; background-position: center; border: 1px solid var(--color-divider);"></div>
  </sc-if>
  <sc-if value="{{ noCover }}" hint-placeholder-val="{{ false }}">
    <div style="width: 96px; aspect-ratio: 2 / 3; box-sizing: border-box; padding: 8px; background: var(--color-accent-900); color: var(--color-bg); display: flex; align-items: flex-end; font-family: 'Noto Serif Georgian', serif; font-weight: 600; font-size: 12px; line-height: 1.2; overflow: hidden;">{{ book.title }}</div>
  </sc-if>
  <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0;">
    <h2 style="margin: 0; font-family: 'Noto Serif Georgian', serif; font-weight: 600; font-size: 19px; line-height: 1.2; text-wrap: pretty;">{{ book.title }}</h2>
    <sc-if value="{{ showMeta }}" hint-placeholder-val="{{ true }}">
      <sc-for list="{{ metaRows }}" as="m" hint-placeholder-count="2">
        <span style="font-size: 13px; line-height: 1.3; color: var(--color-neutral-800);">{{ m.v }}</span>
      </sc-for>
    </sc-if>
    <div style="margin-top: auto; padding-top: var(--space-1); display: flex; flex-direction: column;">
      <span style="font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-neutral-700);">Suggested donation</span>
      <span style="font-family: var(--font-heading); font-weight: 600; font-size: 30px; line-height: 1.05; font-variant-numeric: tabular-nums;">{{ donation }}</span>
    </div>
    <div style="display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap;">
      <span style="font-size: 11px; color: var(--color-neutral-600); font-variant-numeric: tabular-nums;">{{ scannedFmt }}</span>
      <sc-if value="{{ hasBookUrl }}" hint-placeholder-val="{{ false }}">
        <a href="{{ book.bookUrl }}" target="_blank" rel="noopener" style="font-size: 12px; padding: 12px 0; margin: -12px 0;">Book page ↗</a>
      </sc-if>
    </div>
  </div>
</section>
</sc-if>

<sc-if value="{{ isNotFound }}" hint-placeholder-val="{{ false }}">
<section class="blueprint" style="display: flex; flex-direction: column; gap: 2px; padding: var(--space-3);">
  <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
  <span style="font-size: 12px; color: var(--color-neutral-700); font-variant-numeric: tabular-nums;">ISBN {{ scannedFmt }}</span>
  <h2 style="margin: 0; font-family: var(--font-heading); font-weight: 600; font-size: 24px; line-height: 1.1;">Not in the catalogue</h2>
</section>
</sc-if>

<sc-if value="{{ camOpen }}" hint-placeholder-val="{{ false }}">
<section style="position: relative; flex: 1; min-height: 220px; max-height: 62vh; background: var(--color-neutral-900); overflow: hidden;">
  <video ref="{{ videoRef }}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;"></video>
  <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none;">
    <div style="position: relative; width: 78%; aspect-ratio: 2.2 / 1; box-shadow: 0 0 0 100vmax rgba(0,0,0,0.4);">
      <span style="position: absolute; left: 0; top: 0; width: 22px; height: 22px; border-left: 2px solid var(--color-bg); border-top: 2px solid var(--color-bg);"></span>
      <span style="position: absolute; right: 0; top: 0; width: 22px; height: 22px; border-right: 2px solid var(--color-bg); border-top: 2px solid var(--color-bg);"></span>
      <span style="position: absolute; left: 0; bottom: 0; width: 22px; height: 22px; border-left: 2px solid var(--color-bg); border-bottom: 2px solid var(--color-bg);"></span>
      <span style="position: absolute; right: 0; bottom: 0; width: 22px; height: 22px; border-right: 2px solid var(--color-bg); border-bottom: 2px solid var(--color-bg);"></span>
      <span style="position: absolute; left: 6%; right: 6%; top: 50%; height: 1px; background: {{ lineColor }};"></span>
    </div>
  </div>
  <span style="position: absolute; left: var(--space-2); top: var(--space-2); font-size: 12px; color: var(--color-bg); background: rgba(0,0,0,0.45); padding: 4px 8px;">{{ camHint }}</span>
  <button class="btn btn-icon" onClick="{{ closeCam }}" aria-label="Close scanner" style="position: absolute; right: 0; top: 0; width: 48px; height: 48px; color: var(--color-bg); border-color: transparent; background: rgba(0,0,0,0.45);">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
  </button>
</section>
</sc-if>

<sc-if value="{{ isError }}" hint-placeholder-val="{{ false }}">
<section class="blueprint" style="display: flex; flex-direction: column; gap: 4px; padding: var(--space-3);">
  <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
  <h2 style="margin: 0; font-family: var(--font-heading); font-weight: 600; font-size: 22px;">Camera unavailable</h2>
  <p style="margin: 0; font-size: 14px; line-height: 1.4; text-wrap: pretty;">{{ errorBody }}</p>
</section>
</sc-if>

<sc-if value="{{ camClosed }}" hint-placeholder-val="{{ true }}">
<div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; min-height: 120px;">
  <button class="btn btn-primary blueprint" onClick="{{ openCam }}" style="min-height: 72px; font-size: 20px; font-family: var(--font-heading); font-weight: 600; letter-spacing: 0.04em; gap: var(--space-2);">
    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path><path d="M8 7v10"></path><path d="M12 7v10"></path><path d="M17 7v10"></path></svg>
    {{ openLabel }}
  </button>
</div>
</sc-if>

<form onSubmit="{{ submitManual }}" style="display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-2);">
  <input class="input" aria-label="ISBN" inputmode="numeric" autocomplete="off" enterkeyhint="search" placeholder="Type ISBN" value="{{ manualValue }}" onInput="{{ onManualInput }}" style="min-height: 48px; font-size: 18px; font-variant-numeric: tabular-nums;">
  <button class="btn btn-secondary" type="submit" style="min-height: 48px; min-width: 72px; font-size: 15px;">Look up</button>
</form>
<sc-if value="{{ manualInvalid }}" hint-placeholder-val="{{ false }}">
  <span style="margin-top: calc(-1 * var(--space-1)); font-size: 13px; color: var(--color-accent-800);">Not a valid ISBN</span>
</sc-if>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;showMeta&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behaviour&quot;},&quot;preview&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;live&quot;,&quot;idle&quot;,&quot;found&quot;,&quot;notfound&quot;,&quot;error&quot;],&quot;default&quot;:&quot;live&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Design preview&quot;}}">
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1OMB1NlV6G5FUexneGaUtKtfWk4O-ZyG7ocOZHyCl5TM/gviz/tq?tqx=out:csv&gid=62061774';
const CACHE_KEY = 'gbdIsbnScanner.catalogue.v3';
const ZXING_URL = 'https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js';
const SAMPLE = { title: 'ჯაყოს ხიზნები', author: 'მიხეილ ჯავახიშვილი', publisher: 'ინტელექტი', coverUrl: '', bookUrl: '', isbn: '9789941000000', donation: '12' };

function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
const norm = s => s.toLowerCase().replace(/[\s_-]+/g, '');
const findCol = (h, ...keys) => h.findIndex(x => keys.some(k => norm(x).includes(norm(k))));

function ean13Valid(d) {
  if (!/^\d{13}$/.test(d)) return false;
  let s = 0; for (let i = 0; i < 12; i++) s += +d[i] * (i % 2 ? 3 : 1);
  return (10 - (s % 10)) % 10 === +d[12];
}
function isbn10Valid(d) {
  if (!/^\d{9}[\dX]$/.test(d)) return false;
  let s = 0; for (let i = 0; i < 10; i++) s += (d[i] === 'X' ? 10 : +d[i]) * (10 - i);
  return s % 11 === 0;
}
function toIsbn13(raw) {
  const d = String(raw || '').toUpperCase().replace(/[^0-9X]/g, '');
  if (d.length === 13) return ean13Valid(d) && /^97[89]/.test(d) ? d : null;
  if (d.length === 10 && isbn10Valid(d)) {
    const b = '978' + d.slice(0, 9); let s = 0;
    for (let i = 0; i < 12; i++) s += +b[i] * (i % 2 ? 3 : 1);
    return b + ((10 - (s % 10)) % 10);
  }
  return null;
}
const fmt13 = d => d && d.length === 13 ? `${d.slice(0, 3)}-${d.slice(3, 12)}-${d[12]}` : (d || '');
function fmtDonation(v) {
  const s = String(v || '').trim();
  if (!s) return 'Unknown';
  const n = parseFloat(s.replace(/[^\d.,]/g, '').replace(',', '.'));
  if (isNaN(n)) return s;
  return '€' + (Number.isInteger(n) ? n : n.toFixed(2));
}

class Component extends DCLogic {
  state = { books: [], loadState: 'loading', result: null, scanned: '', book: null, badCover: false, cam: 'closed', errorKind: '', manualValue: '', manualInvalid: false, flash: false };
  map = new Map();
  video = null;

  componentDidMount() {
    try {
      const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if (c && c.books) { this.setBooks(c.books); this.setState({ loadState: 'cached' }); }
    } catch (e) {}
    this.fetchSheet();
  }
  componentWillUnmount() { this.stopCamera(); }

  async fetchSheet() {
    try {
      const res = await fetch(SHEET_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      const rows = parseCSV(await res.text());
      const h = rows[0].map(x => x.trim());
      const iT = findCol(h, 'title'), iA = findCol(h, 'author'), iP = findCol(h, 'publisher'),
        iI = findCol(h, 'image', 'cover'), iU = findCol(h, 'book_url', 'link'), iS = findCol(h, 'isbn'),
        iD = findCol(h, 'suggested_donation', 'donation');
      const g = (r, i) => (i >= 0 ? (r[i] || '').trim() : '');
      const books = rows.slice(1).filter(r => g(r, iT)).map(r => ({
        id: g(r, 0), title: g(r, iT), author: g(r, iA), publisher: g(r, iP), coverUrl: g(r, iI), bookUrl: g(r, iU), isbn: g(r, iS), donation: g(r, iD)
      }));
      this.setBooks(books);
      this.setState({ loadState: 'live' });
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), books })); } catch (e) {}
    } catch (e) {
      this.setState(s => ({ loadState: s.books.length ? 'cached' : 'failed' }));
    }
  }
  setBooks(books) {
    const m = new Map();
    books.forEach(b => String(b.isbn || '').split(/[;,/\s]+/).forEach(x => { const k = toIsbn13(x); if (k) m.set(k, b); }));
    this.map = m;
    this.setState({ books });
  }

  lookup(isbn13) {
    if (navigator.vibrate) navigator.vibrate(50);
    const book = this.map.get(isbn13) || null;
    this.setState({ scanned: isbn13, book, badCover: false, result: book ? 'found' : 'notfound', manualValue: '', manualInvalid: false, flash: true });
    clearTimeout(this.flashT); this.flashT = setTimeout(() => this.setState({ flash: false }), 600);
    if (book && book.coverUrl) { const im = new Image(); im.onerror = () => { if (this.state.book === book) this.setState({ badCover: true }); }; im.src = book.coverUrl; }
    window.scrollTo(0, 0);
  }

  // Camera keeps running after a hit; the same code is ignored for 3s so a book left in frame doesn't re-trigger.
  accept(raw) {
    const d = String(raw || '').replace(/\D/g, '');
    if (!(d.length === 13 && /^97[89]/.test(d) && ean13Valid(d))) return;
    const now = Date.now();
    if (d === this.lastCode && now - this.lastAt < 3000) { this.lastAt = now; return; }
    this.lastCode = d; this.lastAt = now;
    this.lookup(d);
  }

  openCam = async () => {
    if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      this.setState({ cam: 'error', errorKind: 'unsupported' }); return;
    }
    this.setState({ cam: 'open' });
    this.scanToken = (this.scanToken || 0) + 1;
    const token = this.scanToken;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
      if (token !== this.scanToken) { stream.getTracks().forEach(t => t.stop()); return; }
      this.stream = stream;
      const v = this.video;
      v.srcObject = stream;
      await v.play().catch(() => {});
      let native = false;
      if ('BarcodeDetector' in window) {
        try { native = (await window.BarcodeDetector.getSupportedFormats()).includes('ean_13'); } catch (e) {}
      }
      if (native) this.loopNative(token); else await this.runZxing(token);
    } catch (e) {
      if (token !== this.scanToken) return;
      this.stopCamera();
      this.setState({ cam: 'error', errorKind: e && e.name === 'NotAllowedError' ? 'denied' : 'unsupported' });
    }
  };
  loopNative(token) {
    const det = new window.BarcodeDetector({ formats: ['ean_13'] });
    let last = 0;
    const tick = async (t) => {
      if (token !== this.scanToken) return;
      if (t - last > 100 && this.video && this.video.readyState >= 2) {
        last = t;
        try { const codes = await det.detect(this.video); codes.forEach(c => this.accept(c.rawValue)); } catch (e) {}
      }
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  }
  async runZxing(token) {
    if (!window.ZXingBrowser) {
      await new Promise((ok, fail) => { const s = document.createElement('script'); s.src = ZXING_URL; s.onload = ok; s.onerror = fail; document.head.appendChild(s); });
    }
    if (token !== this.scanToken) return;
    const reader = new window.ZXingBrowser.BrowserMultiFormatReader();
    this.zx = await reader.decodeFromStream(this.stream, this.video, (res) => {
      if (res && token === this.scanToken) this.accept(res.getText());
    });
  }
  stopCamera() {
    this.scanToken = (this.scanToken || 0) + 1;
    cancelAnimationFrame(this.raf);
    try { this.zx && this.zx.stop(); } catch (e) {}
    this.zx = null;
    if (this.stream) this.stream.getTracks().forEach(t => t.stop());
    this.stream = null;
    if (this.video) this.video.srcObject = null;
  }

  submitManual = (e) => {
    if (e && e.preventDefault) e.preventDefault();
    const k = toIsbn13(this.state.manualValue);
    if (!k) { this.setState({ manualInvalid: true }); return; }
    if (document.activeElement) document.activeElement.blur();
    this.lookup(k);
  };

  renderVals() {
    const preview = this.props.preview ?? 'live';
    const s = { ...this.state };
    if (preview !== 'live') {
      if (preview === 'found') { s.result = 'found'; s.book = s.book || s.books.find(b => b.coverUrl) || SAMPLE; s.scanned = s.scanned || toIsbn13(s.book.isbn) || '9789941000000'; }
      if (preview === 'notfound') { s.result = 'notfound'; s.scanned = s.scanned || '9789941000000'; }
      if (preview === 'error') s.cam = 'error';
      if (preview === 'idle') s.result = null;
    }
    const b = s.book || {};
    const n = s.books.length, m = this.map.size;
    const statusText = s.loadState === 'loading' ? 'Loading…' : s.loadState === 'failed' ? 'Catalogue failed' : s.loadState === 'cached' ? `Offline · ${n}` : `${m} / ${n} with ISBN`;
    const statusColor = s.loadState === 'live' ? 'var(--color-accent)' : s.loadState === 'failed' ? 'var(--color-neutral-900)' : 'var(--color-neutral-400)';
    const metaRows = [];
    if (b.author) metaRows.push({ v: b.author });
    if (b.publisher) metaRows.push({ v: b.publisher });
    return {
      statusText, statusColor,
      isFound: s.result === 'found', isNotFound: s.result === 'notfound',
      book: b, scannedFmt: fmt13(s.scanned), donation: fmtDonation(b.donation),
      hasCover: !!b.coverUrl && !s.badCover, noCover: !b.coverUrl || s.badCover,
      coverCss: b.coverUrl ? `url("${String(b.coverUrl).replace(/"/g, '%22')}")` : 'none',
      showMeta: (this.props.showMeta ?? true) && metaRows.length > 0, metaRows,
      hasBookUrl: !!b.bookUrl,
      camOpen: s.cam === 'open', camClosed: s.cam !== 'open', isError: s.cam === 'error',
      camHint: s.result ? 'Ready for next book' : 'Aim at the barcode',
      lineColor: s.flash ? 'var(--color-bg)' : 'var(--color-accent-300)',
      openLabel: s.result ? 'Scan next book' : 'Start scanning',
      errorBody: s.errorKind === 'denied' ? 'Allow camera access in your browser settings, or type the ISBN below.' : 'This browser can’t scan with the camera (it needs HTTPS). Type the ISBN below.',
      manualValue: s.manualValue, manualInvalid: s.manualInvalid,
      onManualInput: (e) => this.setState({ manualValue: e.target.value, manualInvalid: false }),
      submitManual: this.submitManual,
      videoRef: (el) => { this.video = el; if (el) { el.setAttribute('playsinline', ''); el.setAttribute('muted', ''); el.muted = true; el.autoplay = true; } },
      openCam: this.openCam,
      closeCam: () => { this.stopCamera(); this.setState({ cam: 'closed' }); }
    };
  }
}
</script>
</body>
</html>
